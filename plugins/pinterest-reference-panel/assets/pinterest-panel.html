<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pinterest BoardFlow</title>
    <style>
      :root {
        color-scheme: light dark;
        --paper: #f7f5f1;
        --paper-strong: rgba(252, 251, 248, 0.96);
        --ink: #1b1815;
        --muted: #766f68;
        --line: rgba(38, 31, 26, 0.12);
        --soft: rgba(38, 31, 26, 0.06);
        --accent: #e60023;
        --accent-soft: #fce5e9;
        --success: #13795b;
        --warning: #b45f06;
        --radius: 17px;
        --shadow: 0 18px 45px rgba(45, 34, 27, 0.14);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #141310;
          --paper-strong: rgba(24, 22, 19, 0.96);
          --ink: #f2eee8;
          --muted: #aaa29a;
          --line: rgba(255, 255, 255, 0.14);
          --soft: rgba(255, 255, 255, 0.07);
          --accent-soft: rgba(230, 0, 35, 0.18);
          --success: #68d7ad;
          --warning: #f4b261;
          --shadow: 0 20px 48px rgba(0, 0, 0, 0.35);
        }
      }

      * { box-sizing: border-box; }

      html, body {
        min-width: 0;
        min-height: 100%;
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "Avenir Next", Avenir, "PingFang SC", "Hiragino Sans GB", sans-serif;
      }

      body {
        background:
          radial-gradient(circle at 98% 0%, rgba(230, 0, 35, 0.07), transparent 29%),
          linear-gradient(115deg, transparent 0 64%, rgba(132, 97, 67, 0.035) 64% 65%, transparent 65%),
          var(--paper);
      }

      button { font: inherit; }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

      .shell { min-height: 620px; padding: 0 15px 28px; }

      .panel-chrome {
        position: sticky;
        top: 0;
        z-index: 30;
        margin: 0 -15px;
        padding: 17px 15px 0;
        border-bottom: 1px solid var(--line);
        background: var(--paper-strong);
        box-shadow: 0 12px 30px rgba(40, 31, 25, 0.07);
        backdrop-filter: blur(20px) saturate(1.15);
        -webkit-backdrop-filter: blur(20px) saturate(1.15);
      }

      .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
      .brand { min-width: 0; }
      .brand-line { display: flex; align-items: center; gap: 9px; }
      .mark {
        display: grid;
        width: 27px;
        height: 27px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 50%;
        background: var(--accent);
        color: white;
        font-family: Georgia, serif;
        font-size: 17px;
        font-style: italic;
        font-weight: 700;
      }
      h1 { margin: 0; font-size: 20px; font-weight: 660; letter-spacing: -0.035em; }
      .status-line { display: flex; align-items: center; gap: 6px; margin: 4px 0 0 36px; color: var(--muted); font-size: 10px; }
      .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px color-mix(in srgb, var(--success) 15%, transparent); }
      .status-dot.degraded { background: var(--warning); }
      .toolbar { display: flex; gap: 3px; }
      .icon-button {
        display: grid;
        width: 34px;
        height: 34px;
        padding: 0;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        transition: background 150ms ease, transform 150ms ease;
      }
      .icon-button:hover { background: var(--soft); }
      .icon-button:active { transform: scale(0.91); }
      .icon-button svg { width: 19px; height: 19px; }
      .icon-button.loading svg { animation: spin 700ms linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      .tabs { display: grid; grid-template-columns: 1fr 1fr; margin-top: 12px; }
      .tab {
        position: relative;
        padding: 10px 0 11px;
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 13px;
        font-weight: 590;
      }
      .tab[aria-selected="true"] { color: var(--ink); }
      .tab[aria-selected="true"]::after {
        position: absolute;
        right: 18%;
        bottom: -1px;
        left: 18%;
        height: 2px;
        border-radius: 4px 4px 0 0;
        background: var(--ink);
        content: "";
      }

      .content { padding-top: 14px; }
      .context-row { display: flex; min-height: 28px; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
      .context-copy { overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
      .clear-filter, .load-more, .retry-message {
        padding: 6px 9px;
        border: 0;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        cursor: pointer;
        font-size: 10px;
        font-weight: 700;
      }

      .pin-grid { columns: 2; column-gap: 9px; }
      .pin-card {
        position: relative;
        display: inline-block;
        width: 100%;
        min-height: 108px;
        margin: 0 0 9px;
        padding: 0;
        overflow: hidden;
        break-inside: avoid;
        border: 0;
        border-radius: var(--radius);
        background: #d7d0c8;
        box-shadow: 0 0 0 1px var(--line);
        cursor: pointer;
        text-align: left;
        transform: translateZ(0);
        animation: reveal 360ms both;
        transition: transform 170ms ease, box-shadow 170ms ease;
      }
      .pin-card:nth-child(2n) { animation-delay: 45ms; }
      .pin-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
      .pin-card:disabled { cursor: progress; }
      @keyframes reveal { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }

      .pin-image { display: block; width: 100%; height: auto; min-height: 108px; object-fit: cover; background: linear-gradient(135deg, #d7d0c8, #eee9e1); }
      .placeholder { display: grid; min-height: 150px; place-items: center; color: rgba(255,255,255,.8); background: linear-gradient(145deg, #786e64, #b5a89c); font-family: Georgia, serif; font-size: 27px; font-style: italic; }
      .card-wash { position: absolute; inset: auto 0 0; padding: 28px 9px 8px; color: white; background: linear-gradient(transparent, rgba(0,0,0,.72)); }
      .card-title { display: -webkit-box; overflow: hidden; font-size: 11px; font-weight: 650; line-height: 1.25; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
      .card-board { display: block; margin-top: 3px; overflow: hidden; font-size: 9px; opacity: .76; text-overflow: ellipsis; white-space: nowrap; }
      .action-state {
        position: absolute;
        top: 8px;
        right: 8px;
        display: grid;
        min-width: 25px;
        height: 25px;
        padding: 0 7px;
        place-items: center;
        border: 1px solid rgba(255,255,255,.58);
        border-radius: 999px;
        background: rgba(20,18,16,.58);
        color: white;
        font-size: 10px;
        font-weight: 700;
        backdrop-filter: blur(9px);
      }
      .action-state.done { background: var(--success); }
      .action-state.failed { background: var(--warning); }
      .action-state.busy::before { width: 11px; height: 11px; border: 2px solid rgba(255,255,255,.42); border-top-color: white; border-radius: 50%; content: ""; animation: spin 650ms linear infinite; }

      .board-list { display: grid; gap: 10px; }
      .board-card { display: grid; grid-template-columns: 104px minmax(0, 1fr); min-height: 88px; padding: 0; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper-strong); color: var(--ink); cursor: pointer; text-align: left; transition: transform 170ms ease, box-shadow 170ms ease; }
      .board-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
      .board-collage { display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; background: var(--line); }
      .board-collage img, .board-collage .swatch { width: 100%; height: 100%; min-height: 42px; object-fit: cover; background: linear-gradient(145deg, #7d7268, #d7ccc0); }
      .board-collage > :first-child { grid-row: 1 / 3; }
      .board-copy { align-self: center; min-width: 0; padding: 11px; }
      .board-title { overflow: hidden; font-size: 13px; font-weight: 680; text-overflow: ellipsis; white-space: nowrap; }
      .board-meta { margin-top: 5px; color: var(--muted); font-size: 10px; }

      .empty { display: grid; min-height: 360px; place-items: center; padding: 32px 18px; text-align: center; }
      .empty-card { max-width: 270px; }
      .empty-mark { display: grid; width: 58px; height: 58px; margin: 0 auto 16px; place-items: center; border: 1px solid var(--line); border-radius: 19px; background: var(--paper-strong); color: var(--accent); font-family: Georgia, serif; font-size: 30px; font-style: italic; box-shadow: var(--shadow); transform: rotate(-4deg); }
      .empty h2 { margin: 0; font-family: Georgia, "Songti SC", serif; font-size: 20px; font-weight: 500; }
      .empty p { margin: 9px 0 0; color: var(--muted); font-size: 11px; line-height: 1.65; }
      .path { display: block; margin-top: 11px; padding: 7px 9px; overflow: hidden; border-radius: 8px; background: var(--soft); font-family: ui-monospace, monospace; font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
      .footer { display: grid; place-items: center; padding: 15px 0 2px; }
      .load-more:disabled { opacity: .55; cursor: progress; }

      .toast { position: fixed; right: 14px; bottom: 15px; left: 14px; z-index: 50; padding: 10px 12px; border: 1px solid var(--line); border-radius: 13px; background: var(--paper-strong); box-shadow: var(--shadow); font-size: 11px; line-height: 1.4; opacity: 0; pointer-events: none; transform: translateY(10px); transition: opacity 180ms ease, transform 180ms ease; }
      .toast.visible { opacity: 1; transform: translateY(0); }

      @media (max-width: 245px) { .pin-grid { columns: 1; } .status-line { margin-left: 0; } .board-card { grid-template-columns: 82px minmax(0,1fr); } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="panel-chrome">
        <header class="topbar">
          <div class="brand">
            <div class="brand-line"><span class="mark" aria-hidden="true">P</span><h1>Pinterest BoardFlow</h1></div>
            <div class="status-line"><span class="status-dot" id="status-dot"></span><span id="status-copy">正在连接本地 Inbox…</span></div>
          </div>
          <div class="toolbar">
            <button class="icon-button" id="refresh" type="button" aria-label="刷新 Pinterest BoardFlow" title="刷新">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 11a8.1 8.1 0 1 0-2.3 5.8"/><path d="M20 5v6h-6"/></svg>
            </button>
            <button class="icon-button" id="about" type="button" aria-label="查看说明" title="说明">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
            </button>
          </div>
        </header>
        <nav class="tabs" aria-label="Pinterest BoardFlow 内容类型" role="tablist">
          <button class="tab" type="button" role="tab" aria-selected="true" data-tab="pins">Pins</button>
          <button class="tab" type="button" role="tab" aria-selected="false" data-tab="boards">Boards</button>
        </nav>
      </div>
      <section class="content" id="panel" role="tabpanel">
        <div class="context-row"><div class="context-copy" id="context-copy">0 张图片</div><button class="clear-filter" id="clear-filter" type="button" hidden>查看全部</button></div>
        <div id="content-root"></div>
        <div class="footer"><button class="load-more" id="load-more" type="button" hidden>加载更多</button></div>
      </section>
    </main>
    <div class="toast" id="toast" role="status"></div>

    <script>
      (() => {
        const state = {
          data: { mode: "inbox", version: 0, total: 0, assets: [], boards: [], nextCursor: null, watcherStatus: "starting", transfer: { moved: 0, deduplicated: 0, renamed: 0, failed: 0, pending: 0 }, workspace: { available: false, token: null, reason: "尚未连接工作区" } },
          thumbnails: {},
          inboxPath: "~/Pictures/PinterestInbox",
          stagingPath: "~/Downloads/PinterestInbox",
          workspaceToken: null,
          tab: "pins",
          boardId: null,
          pending: new Set(),
          importedPaths: new Map(),
          failedMessages: new Set(),
          pendingRequests: new Map(),
          requestId: 1,
          polling: false
        };

        const root = document.getElementById("content-root");
        const contextCopy = document.getElementById("context-copy");
        const clearFilter = document.getElementById("clear-filter");
        const refreshButton = document.getElementById("refresh");
        const loadMoreButton = document.getElementById("load-more");
        const toast = document.getElementById("toast");
        const statusCopy = document.getElementById("status-copy");
        const statusDot = document.getElementById("status-dot");

        function request(method, params, timeoutMs = 5000) {
          if (window.parent === window) return Promise.reject(new Error("No embedded MCP Apps host"));
          const id = state.requestId++;
          window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
          return new Promise((resolve, reject) => {
            const timeout = window.setTimeout(() => { state.pendingRequests.delete(id); reject(new Error("Host bridge timed out")); }, timeoutMs);
            state.pendingRequests.set(id, { resolve, reject, timeout });
          });
        }

        async function callTool(name, args) {
          try { return await request("tools/call", { name, arguments: args }); }
          catch (error) {
            if (window.openai?.callTool) return window.openai.callTool(name, args);
            throw error;
          }
        }

        function findInboxMeta(value, depth = 0) {
          if (!value || typeof value !== "object" || depth > 5) return null;
          if (value.pinterestInbox) return value.pinterestInbox;
          for (const key of ["_meta", "call_tool_result", "mcp_tool_result", "result", "toolResponseMetadata"]) {
            const found = findInboxMeta(value[key], depth + 1);
            if (found) return found;
          }
          return null;
        }

        function structured(value) {
          return value?.structuredContent ?? value?.call_tool_result?.structuredContent ?? value?.mcp_tool_result?.structuredContent ?? value;
        }

        function acceptResult(value, append = false) {
          const next = structured(value);
          if (!next || next.mode !== "inbox") return false;
          if (next.unchanged) {
            state.data = { ...state.data, ...next, assets: state.data.assets, boards: state.data.boards };
            render();
            return true;
          }
          const meta = findInboxMeta(value) ?? findInboxMeta(window.openai?.toolResponseMetadata);
          if (meta?.thumbnails) Object.assign(state.thumbnails, meta.thumbnails);
          if (meta?.inboxPath) state.inboxPath = meta.inboxPath;
          if (meta?.stagingPath) state.stagingPath = meta.stagingPath;
          if (meta?.workspaceToken) state.workspaceToken = meta.workspaceToken;
          if (!Array.isArray(next.assets) || !Array.isArray(next.boards)) return false;
          const workspace = next.workspace ?? state.data.workspace;
          state.data = { ...next, workspace, assets: append ? [...state.data.assets, ...next.assets] : next.assets };
          render();
          return true;
        }

        window.addEventListener("message", (event) => {
          if (event.source !== window.parent) return;
          const message = event.data;
          if (!message || message.jsonrpc !== "2.0") return;
          if (message.id !== undefined && state.pendingRequests.has(message.id)) {
            const pending = state.pendingRequests.get(message.id);
            state.pendingRequests.delete(message.id);
            clearTimeout(pending.timeout);
            if (message.error) pending.reject(message.error); else pending.resolve(message.result);
            return;
          }
          if (message.method === "ui/notifications/tool-result") acceptResult(message.params);
        }, { passive: true });

        function showToast(message, hold = false) {
          toast.textContent = message;
          toast.classList.add("visible");
          clearTimeout(showToast.timer);
          if (!hold) showToast.timer = setTimeout(() => toast.classList.remove("visible"), 2600);
        }

        function updateHeader() {
          const watcher = state.data.watcherStatus;
          statusDot.classList.toggle("degraded", watcher !== "watching");
          const workspace = state.data.workspace;
          const workspaceCopy = workspace?.available ? ` · ${workspace.name}` : " · 仅浏览";
          const transfer = state.data.transfer;
          const transferCopy = transfer?.failed ? ` · ${transfer.failed} 个待重试` : transfer?.moved ? ` · 已收取 ${transfer.moved}` : "";
          statusCopy.textContent = `${watcher === "watching" ? "Watching" : "Reconnecting"} · ${state.data.total} assets${transferCopy}${workspaceCopy}`;
        }

        function actionLabel(assetId) {
          if (state.pending.has(assetId)) return { className: "busy", text: "" };
          if (state.failedMessages.has(assetId)) return { className: "failed", text: "重试" };
          if (state.importedPaths.has(assetId)) return { className: "done", text: "✓" };
          return { className: "", text: "+" };
        }

        function makePinCard(asset) {
          const card = document.createElement("button");
          card.className = "pin-card";
          card.type = "button";
          card.disabled = state.pending.has(asset.id);
          card.setAttribute("aria-label", `将 ${asset.title} 加入当前任务`);
          const thumbnail = state.thumbnails[asset.id];
          if (thumbnail) {
            const image = document.createElement("img");
            image.className = "pin-image";
            image.src = thumbnail;
            image.alt = asset.title;
            image.loading = "lazy";
            card.append(image);
          } else {
            const placeholder = document.createElement("div");
            placeholder.className = "placeholder";
            placeholder.textContent = "P";
            card.append(placeholder);
          }
          const wash = document.createElement("div");
          wash.className = "card-wash";
          wash.innerHTML = `<span class="card-title"></span><span class="card-board"></span>`;
          wash.querySelector(".card-title").textContent = asset.title;
          wash.querySelector(".card-board").textContent = asset.boardTitle;
          const badge = document.createElement("span");
          const label = actionLabel(asset.id);
          badge.className = `action-state ${label.className}`;
          badge.textContent = label.text;
          card.append(wash, badge);
          card.addEventListener("click", () => void importReference(asset));
          return card;
        }

        function renderPins() {
          const visible = state.boardId ? state.data.assets.filter((asset) => asset.boardId === state.boardId) : state.data.assets;
          const board = state.data.boards.find((item) => item.id === state.boardId);
          contextCopy.textContent = board ? `${board.title} · ${visible.length} 张已加载` : `${state.data.total} 张本地图片`;
          clearFilter.hidden = !state.boardId;
          if (state.data.total === 0) return renderEmpty();
          const grid = document.createElement("div");
          grid.className = "pin-grid";
          visible.forEach((asset) => grid.append(makePinCard(asset)));
          root.replaceChildren(grid);
          loadMoreButton.hidden = Boolean(state.boardId) || !state.data.nextCursor;
        }

        function renderBoards() {
          contextCopy.textContent = `${state.data.boards.length} 个已下载图版`;
          clearFilter.hidden = true;
          loadMoreButton.hidden = true;
          if (state.data.boards.length === 0) return renderEmpty();
          const list = document.createElement("div");
          list.className = "board-list";
          state.data.boards.forEach((board) => {
            const card = document.createElement("button");
            card.className = "board-card";
            card.type = "button";
            const collage = document.createElement("div");
            collage.className = "board-collage";
            for (let index = 0; index < 3; index += 1) {
              const assetId = board.coverAssetIds[index];
              const thumbnail = state.thumbnails[assetId];
              const item = thumbnail ? document.createElement("img") : document.createElement("div");
              if (thumbnail) item.src = thumbnail; else item.className = "swatch";
              collage.append(item);
            }
            const copy = document.createElement("div");
            copy.className = "board-copy";
            copy.innerHTML = `<div class="board-title"></div><div class="board-meta">${board.pinCount} 个 Pin</div>`;
            copy.querySelector(".board-title").textContent = board.title;
            card.append(collage, copy);
            card.addEventListener("click", () => { state.boardId = board.id; state.tab = "pins"; render(); });
            list.append(card);
          });
          root.replaceChildren(list);
        }

        function renderEmpty() {
          const wrapper = document.createElement("div");
          wrapper.className = "empty";
          const card = document.createElement("div");
          card.className = "empty-card";
          card.innerHTML = `<div class="empty-mark">P</div><h2>Inbox 还是空的</h2><p>在 Chrome 中打开 Pinterest 图版，使用配套扩展下载图片。插件会从下载暂存区自动收取新素材。</p><span class="path"></span>`;
          card.querySelector(".path").textContent = state.inboxPath;
          wrapper.append(card);
          root.replaceChildren(wrapper);
          loadMoreButton.hidden = true;
        }

        function render() {
          document.querySelectorAll(".tab").forEach((tab) => tab.setAttribute("aria-selected", String(tab.dataset.tab === state.tab)));
          updateHeader();
          if (state.tab === "pins") renderPins(); else renderBoards();
        }

        async function sendReferenceMessage(asset, relativePath) {
          const prompt = `请读取并将工作区图片 @${relativePath} 作为当前任务的视觉参考。素材名称：${asset.title}。`;
          try { return await request("ui/message", { role: "user", content: [{ type: "text", text: prompt }] }, 1800); }
          catch (error) {
            if (window.openai?.sendFollowUpMessage) return window.openai.sendFollowUpMessage({ prompt, scrollToBottom: false });
            throw error;
          }
        }

        async function importReference(asset) {
          if (state.pending.has(asset.id)) return;
          if (!state.data.workspace?.available || !state.workspaceToken) {
            showToast(state.data.workspace?.reason || "未连接当前工作区，请从 Codex 任务内重新打开插件。");
            return;
          }
          state.pending.add(asset.id);
          state.failedMessages.delete(asset.id);
          render();
          try {
            let relativePath = state.importedPaths.get(asset.id);
            if (!relativePath) {
              const result = await callTool("import_pinterest_reference", { assetId: asset.id, workspaceToken: state.workspaceToken });
              const data = structured(result);
              if (!data?.relativePath) throw new Error("导入工具未返回文件路径");
              relativePath = data.relativePath;
              state.importedPaths.set(asset.id, relativePath);
            }
            try {
              await sendReferenceMessage(asset, relativePath);
              state.failedMessages.delete(asset.id);
              showToast(`已加入当前任务 · ${relativePath}`);
            } catch {
              state.failedMessages.add(asset.id);
              showToast(`图片已导入 ${relativePath}，单击卡片重试发送。`, true);
            }
          } catch (error) {
            showToast(error instanceof Error ? error.message : "导入失败", true);
          } finally {
            state.pending.delete(asset.id);
            render();
          }
        }

        async function refresh(forceRescan = false) {
          refreshButton.classList.add("loading");
          try {
            const result = await callTool("list_pinterest_inbox", { limit: 30, forceRescan });
            if (!acceptResult(result)) throw new Error("返回数据格式不正确");
            if (forceRescan) showToast("Pinterest BoardFlow 已刷新");
          } catch (error) {
            showToast(error instanceof Error ? error.message : "无法读取 Pinterest BoardFlow");
          } finally { refreshButton.classList.remove("loading"); }
        }

        async function poll() {
          if (state.polling || document.visibilityState !== "visible") return;
          state.polling = true;
          try {
            const result = await callTool("list_pinterest_inbox", { knownVersion: state.data.version, limit: 30 });
            acceptResult(result);
          } catch {
            statusDot.classList.add("degraded");
          } finally { state.polling = false; }
        }

        document.querySelectorAll(".tab").forEach((tab) => tab.addEventListener("click", () => { state.tab = tab.dataset.tab; render(); }));
        clearFilter.addEventListener("click", () => { state.boardId = null; render(); });
        refreshButton.addEventListener("click", () => void refresh(true));
        document.getElementById("about").addEventListener("click", () => showToast(`长期素材库：${state.inboxPath}。临时下载区：${state.stagingPath}。`));
        loadMoreButton.addEventListener("click", async () => {
          if (!state.data.nextCursor) return;
          loadMoreButton.disabled = true;
          try { acceptResult(await callTool("list_pinterest_inbox", { cursor: state.data.nextCursor, limit: 30 }), true); }
          finally { loadMoreButton.disabled = false; }
        });

        const initialMeta = findInboxMeta(window.openai?.toolResponseMetadata);
        if (initialMeta?.thumbnails) Object.assign(state.thumbnails, initialMeta.thumbnails);
        if (initialMeta?.workspaceToken) state.workspaceToken = initialMeta.workspaceToken;
        if (initialMeta?.inboxPath) state.inboxPath = initialMeta.inboxPath;
        if (initialMeta?.stagingPath) state.stagingPath = initialMeta.stagingPath;
        if (window.openai?.toolOutput) acceptResult(window.openai.toolOutput);
        render();
        request("ui/initialize", { appInfo: { name: "Pinterest BoardFlow", version: "0.4.1" }, appCapabilities: {} }).catch(() => {});
        setInterval(() => void poll(), 2000);
      })();
    </script>
  </body>
</html>
